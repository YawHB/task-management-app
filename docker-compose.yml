version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: todoapp_postgres

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: todoapp_db

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: