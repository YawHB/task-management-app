
#ROOT
openapi: 3.0.0
info:
  title: Task Management API
  description: "API's for our task-management application"
  version: '1.0'
servers:
  - url: 'http://localhost:8081'
tags:
  - name: Task
  - name: User
  - name: Organisation
  - name: Project


#TASK
paths:
  /api/tasks:
    $ref: './paths/tasks.yaml'
  /api/tasks/{id}:
    $ref: './paths/tasks-id.yaml'

#USER
  /api/users:
    $ref: './paths/users.yaml'
  /api/users/{id}:
    $ref: './paths/users-id.yaml'

#ORGANISATION
  /api/organisations:
    $ref: './paths/organisations.yaml'
  /api/organisations/{id}:
    $ref: './paths/organisations-id.yaml'

  #PROJECT
  /api/projects/{organisationId}:
    $ref: './paths/projects.yaml'


components:
  schemas:
    Task:
      $ref: './schemas/task/task.yaml'
    Status:
      $ref: './schemas/task/status.yaml'
    Priority:
      $ref: './schemas/task/priority.yaml'
    User:
      $ref: "./schemas/user/userDTO.yaml"


