
#ROOT
openapi: 3.0.0
info:
  title: Task Management API
  description: "API's for our task-management application"
  version: '1.0'
servers:
  - url: 'http://localhost:8081'
tags:
  - name: Task
  - name: User
  - name: Project
  - name: Organisation



#TASK
paths:
  /api/project/{projectId}/tasks:
    $ref: './paths/task/tasks.yaml'
  /api/project/{projectId}/tasks/{taskId}/assignee:
    $ref: './paths/task/task-assignee.yaml'
  /api/projects/{projectId}/tasks/{taskId}:
    $ref: './paths/task/tasks-id.yaml'

#USER
  /api/users:
    $ref: './paths/user/users.yaml'
  /api/users/{id}:
    $ref: './paths/user/users-id.yaml'

# create these endpoints to fetch users for orgs or project
 # /api/organisations/{organisationId}/users:
  #  $ref: 'insert path here'
  #/api/projects/{projectId}/users:
   # $ref: 'insert path here'

  /api/organisations/{organisationId}/projects/users:
    $ref: './paths/user/organisations-id-projects-users.yaml'
  /api/users/{user-id}/organisations:
    $ref: './paths/user/users-user-id-organisations.yaml'

  #PROJECT
  /api/organisations/{organisationId}/projects:
    $ref: './paths/project/projects.yaml'
  /api/projects/{projectId}:
    $ref: './paths/project/projects-id.yaml'
  /api/organisations/{organisationId}/projects/{projectId}/users/{userId}:
    $ref: './paths/project/projects-id-users-id.yaml'

#ORGANISATION
  /api/organisations:
    $ref: './paths/organisation/organisations.yaml'
  /api/organisations/{id}:
    $ref: './paths/organisation/organisations-id.yaml'
  /api/organisations/{id}/users:
    $ref: './paths/organisation/organisations-id-users.yaml'




