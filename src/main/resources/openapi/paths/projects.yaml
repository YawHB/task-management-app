# PROJECT PATH

get:
  tags:
    - Project
  summary: 'Get all the projects assigned to a member, within a given organisation'
  operationId: getProjectsForMemberInOrganisation
  parameters:
    - name: organisationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: 'Id of the current organisation'
    - name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
        description: 'Id of the member sending the request'
  responses:
    '200':
      description: 'Projects for member fetched successfully'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/project/projectSummaryDTO.yaml'
          example:
            - projectId: "100e8400-e29b-41d4-a716-446655440011"
              projectName: "John's project 1"
            - projectId: "200e8400-e29b-41d4-a716-446655440022"
              projectName: "John's project 2"
    '404':
      description: 'Organisation or user not found'
      content:
        application/json:
          schema:
            $ref: '../schemas/errorResponses/errorResponseDTO.yaml'
    '409':
      description: 'User not member of organisation'
      content:
        application/json:
          schema:
            $ref: '../schemas/errorResponses/errorResponseDTO.yaml'

post:
  tags:
    - Project
  summary: 'Create a new project in an organisation'
  description: 'Create a new project in an organisation. Time of creating will be autogenerated'
  operationId: addProject
  parameters:
    - name: organisationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/project/ProjectPost.yaml'

  responses:
    '201':
      description: 'Project created successfully'
      content:
        application/json:
          schema:
            $ref: '../schemas/project/projectDTO.yaml'
    '400':
      description: 'Bad request. Check parameter and request-body format'
      content:
        application/json:
          schema:
            $ref: '../schemas/errorResponses/errorResponseDTO.yaml'
    '500':
      description: 'Internal server error'
      content:
        application/json:
          schema:
            $ref: '../schemas/errorResponses/errorResponseDTO.yaml'