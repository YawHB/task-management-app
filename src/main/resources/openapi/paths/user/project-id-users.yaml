get:
  tags:
    - User
  summary: 'Get all members of a project'
  operationId: 'getUsersInProject'
  parameters:
    - name: 'projectId'
      in: path
      required: true
      description: 'The id of the project'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 'Members of project were successfully fetched'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/user/userSummaryDTO.yaml'
    '404':
      description: 'The project you requested does not exist'
      content:
        application/json:
          schema:
            $ref: '../../schemas/errorResponses/errorResponseDTO.yaml'
    '500':
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: '../../schemas/errorResponses/errorResponseDTO.yaml'
