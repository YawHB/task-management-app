
#ORGANISATION-ID PATH
get:
  tags:
    - Organisation
  summary: 'Get an organisation by id'
  description: 'Returns a specified organisation based on a organisation id'
  operationId: 'getOrganisationById'
  parameters:
    - name: id
      in: path
      required: true
      description: 'Unique identifier for the organisation'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 'Organisation was successfully fetched'
      content:
        application/json:
          schema:
            $ref: '../schemas/organisation/organisationDetailsDTO.yaml'
    '400':
      description: 'Bad request. Invalid organisation id format'
    '404':
      description: 'The organisation you request does not exist'
    '500':
      description: 'Internal Server Error'

