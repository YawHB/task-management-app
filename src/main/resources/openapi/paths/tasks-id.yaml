#TASK-ID PATH

get:
  tags:
    - Task
  summary: 'Get a task by id'
  description: 'Returns a specified task in a project based on a task- and project id'
  operationId: 'getTaskByInProject'
  parameters:
    - name: projectId
      in: path
      required: true
      description: 'Unique identifier of the project'
      schema:
        type: string
        format: uuid
    - name: taskId
      in: path
      required: true
      description: 'Unique identifier of the task'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 'Task was successfully fetched'
      content:
        application/json:
          schema:
            $ref: '../schemas/task/taskDTO.yaml'
    '400':
      description: 'Bad Request. Task with this id does not exist.'
    '500':
      description: 'Internal Server Error'
put:
  tags:
    - Task
  summary: 'Update a single task'
  description: 'Updates and returns a single task'
  operationId: 'updateTask'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/task/updateTaskDTO.yaml'
  responses:
    '200':
      description: 'Task was successfully updated'
      content:
        application/json:
          schema:
            $ref: '../schemas/task/taskDTO.yaml'
    '400':
      description: 'Bad Request. Invalid task id format.'
    '500':
      description: 'Internal Server Error'


