#CREATE-TASK SCHEMA

type: object
required:
  - projectId
  - taskCreatorId
  - taskTitle
  - status
  - priority

properties:
  taskTitle:
    type: string
    minLength: 1
  description:
    type: string
  parentTaskId:
    type: string
    format: uuid
    nullable: true
  projectId:
     type: string
     format: uuid
  assigneeId:
    type: string
    format: uuid
    nullable: true
  taskCreatorId:
      type: string
      format: uuid
  status:
    $ref: './statusDTO.yaml'
  priority:
    $ref: './priorityDTO.yaml'
  dueDate:
    type: string
    format: date
example:
  taskTitle: 'Complete quarterly review report'
  description: 'Gather inputs from all stakeholders and submit final document'
  parentTaskId: '3482710d-6ac2-41c0-826b-365328d8c359'
  projectId: 'd63a1f85-9c27-4b64-a8e3-51f7c2094d32'
  assigneeId: '7f3a2c91-6d84-4b17-9e52-1c8a7f4d3b26'
  taskCreatorId: '9f86d081-884c-4d5f-9f6a-2c7e8b4d3a91'
  status: 'IN-PROGRESS'
  priority: 'MEDIUM'
  dueDate: '2027-08-31'
