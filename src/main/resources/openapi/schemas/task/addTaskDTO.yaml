#CREATE-TASK SCHEMA

type: object
required:
  - projectId
  - taskCreatorId
  - taskTitle
  - status
  - priority

properties:
  taskTitle:
    type: string
    minLength: 1
  description:
    type: string
  parentTaskId:
    type: string
    format: uuid
    nullable: true
  projectId:
     type: string
     format: uuid
  assigneeId:
    type: string
    format: uuid
    nullable: true
  taskCreatorId:
      type: string
      format: uuid
  status:
    $ref: './statusDTO.yaml'
  priority:
    $ref: './priorityDTO.yaml'
  dueDate:
    type: string
    format: date
example:
  taskTitle: 'Complete quarterly review report'
  description: 'Gather inputs from all stakeholders and submit final document'
  parentTaskId: '6ba7b810-9dad-11d1-80b4-00c04fd430c8'
  projectId: '7c9e6679-7425-40de-944b-e07fc1f90ae7'
  assigneeId: '8f14e45f-ea7f-4f2b-8b2d-6d3f9c5a1b72'
  taskCreatorId: '9f86d081-884c-4d5f-9f6a-2c7e8b4d3a91'
  status: 'IN-PROGRESS'
  priority: 'MEDIUM'
  dueDate: '2026-08-31'
